name: Deploy to GitHub Pages

on:
  push:
    # Every branch deploys: main to the site root, the rest to preview folders.
    # gh-pages is the published output and must not build itself.
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Per branch, so a new push supersedes its own in-flight deploy without
  # cancelling another branch's. Races between branches are resolved by the
  # publish script retrying against the updated gh-pages tip.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: target
        run: .github/scripts/pages-target.sh
        env:
          BRANCH: ${{ github.ref_name }}

      - run: npm ci
      # Gates run before the build so a lint, type or test failure fails the
      # deploy rather than shipping. `build` re-runs vue-tsc, but a dedicated
      # step attributes the failure instead of burying it in a build log.
      - run: npm run lint:check
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}

      - run: .github/scripts/publish-pages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_DIR: dist
          TARGET_PATH: ${{ steps.target.outputs.path }}
          COMMIT_NOTE: ${{ github.ref_name }} @ ${{ github.sha }}

      - name: Link the deployment
        run: echo "Deployed \`${{ github.ref_name }}\` to ${{ steps.target.outputs.url }}" >>"$GITHUB_STEP_SUMMARY"
