      content="AlgoViz — watch sorting, searching, pathfinding, graph, DP, hashing and concurrency algorithms run step by step."

    <title>AlgoViz — Algorithm Visualizer</title>
    <!--
      Apply the theme before first paint. `main.ts` also applies it, but that
      runs once the module graph has loaded, which is far too late: the themes
      differ enough (Paper vs Terminal) that the flash would be a visibly
      different application rather than a slightly wrong shade.

      This deliberately does NOT validate the stored name. An unknown value
      falls through as-is and simply matches no `[data-theme]` block, so the
      `:root` defaults render; the theme module then corrects storage a moment
      later. Duplicating the registry here would only create a second list to
      keep in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('algoviz-theme');
          // The key used to hold 'dark'/'light' before themes had names.
          var name =
            stored === 'dark' || !stored
              ? 'midnight'
              : stored === 'light'
                ? 'daylight'
                : stored;
          document.documentElement.setAttribute('data-theme', name);
        } catch (e) {
          /* localStorage unavailable — :root defaults are already correct. */
        }
      })();
    </script>
